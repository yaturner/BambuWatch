org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# App version, shared by phone and watch. Play needs distinct versionCodes per bundle:
# phone = appVersionCode * 10, watch = appVersionCode * 10 + 1. Bump appVersionCode for each release.
appVersionName=1.0.0
appVersionCode=1
